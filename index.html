<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบยืม-คืนอุปกรณ์ แผนกเทคโนโลยีธุรกิจดิจิทัล / คอมพิวเตอร์</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen py-6 px-4">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">ระบบยืม-คืนอุปกรณ์</h1>
                <p class="text-sm text-slate-500">แผนกเทคโนโลยีธุรกิจดิจิทัล / คอมพิวเตอร์ (ฐานข้อมูลกลาง)</p>
            </div>
            <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl font-medium shadow-sm transition flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                </svg>
                <span>1. ทำรายการยืมใหม่</span>
            </button>
        </div>

        <!-- Filter & Search -->
        <div class="bg-white rounded-2xl shadow-sm p-4 mb-6 flex flex-col md:flex-row gap-4 justify-between">
            <input type="text" id="searchInput" oninput="renderTable()" placeholder="🔍 ค้นหาชื่อผู้ยืม, อุปกรณ์, แผนก..." class="w-full md:w-96 px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 text-sm">
            
            <select id="statusFilter" onchange="renderTable()" class="px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 text-sm">
                <option value="all">สถานะทั้งหมด</option>
                <option value="active">กำลังยืม</option>
                <option value="returned">คืนแล้ว</option>
            </select>
        </div>

        <!-- Table -->
        <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-100 text-xs uppercase text-slate-400 font-semibold">
                            <th class="p-4">ผู้ยืม / แผนก</th>
                            <th class="p-4">อุปกรณ์ / ต้นสังกัด</th>
                            <th class="p-4">วันที่ยืม</th>
                            <th class="p-4">กำหนดคืน</th>
                            <th class="p-4">สถานะ</th>
                            <th class="p-4 text-center">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="text-sm">
                        <!-- ข้อมูลจะถูกโหลดเข้ามาตรงนี้ -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal ฟอร์มยืมอุปกรณ์ -->
    <div id="borrowModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
            <h2 class="text-lg font-bold text-slate-900 mb-4">บันทึกการยืมอุปกรณ์</h2>
            <form id="borrowForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">ชื่อผู้ยืม <span class="text-red-500">*</span></label>
                    <input type="text" id="borrowerName" required placeholder="ระบุชื่อ-นามสกุล ผู้ขอยืม" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">แผนกของผู้ยืม <span class="text-red-500">*</span></label>
                    <input type="text" id="department" required placeholder="เช่น ปวช.3 เทคโนโลยีธุรกิจดิจิทัล" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">สังกัดแผนกของอุปกรณ์ <span class="text-red-500">*</span></label>
                    <input type="text" id="ownerDept" required placeholder="เช่น แผนกคอมพิวเตอร์" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">ชื่ออุปกรณ์ / รหัสครุภัณฑ์ <span class="text-red-500">*</span></label>
                    <input type="text" id="deviceName" required placeholder="เช่น โน้ตบุ๊กกลาง #01" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">กำหนดคืน <span class="text-red-500">*</span></label>
                    <input type="date" id="dueDate" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="closeModal()" class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-600 py-3 rounded-xl font-medium transition text-sm">ยกเลิก</button>
                    <button type="submit" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-medium transition text-sm shadow-sm">บันทึกการยืม</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script เชื่อมต่อ Google Sheets -->
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyWtvR1DzOD9na3502nzo9p6KOg0TOJ1-H6ChW-ouY4cxwf11xYqD_BUboioPi3nZ6w1w/exec";
        let borrows = [];

        async function fetchBorrows() {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-slate-400">กำลังซิงค์ข้อมูลจากฐานข้อมูลกลาง...</td></tr>`;
            try {
                const response = await fetch(WEB_APP_URL);
                const data = await response.json();
                borrows = data;
                renderTable();
            } catch (error) {
                console.error("Error loading data:", error);
                tableBody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-red-500">ไม่สามารถเชื่อมต่อฐานข้อมูลได้</td></tr>`;
            }
        }

        function renderTable() {
            const tableBody = document.getElementById('tableBody');
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;

            const filtered = borrows.filter(item => {
                const matchKeyword = (item.borrower && item.borrower.toLowerCase().includes(keyword)) ||
                                     (item.device && item.device.toLowerCase().includes(keyword)) ||
                                     (item.dept && item.dept.toLowerCase().includes(keyword));
                const matchStatus = statusFilter === 'all' || item.status === statusFilter;
                return matchKeyword && matchStatus;
            });

            if (filtered.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-slate-400">ไม่พบรายการยืมในระบบ</td></tr>`;
                return;
            }

            tableBody.innerHTML = filtered.map(item => {
                let statusBadge = '';
                if (item.status === 'returned') {
                    statusBadge = `<span class="bg-slate-100 text-slate-600 px-3 py-1 rounded-full text-xs font-semibold">คืนแล้ว</span>`;
                } else {
                    statusBadge = `<span class="bg-emerald-100 text-emerald-600 px-3 py-1 rounded-full text-xs font-semibold">กำลังยืม</span>`;
                }

                return `
                    <tr class="border-b border-slate-100 hover:bg-slate-50/50 transition">
                        <td class="p-4 font-medium text-slate-800">${item.borrower} <br><span class="text-xs text-slate-400">${item.dept}</span></td>
                        <td class="p-4 text-slate-600">${item.device} <br><span class="text-xs text-slate-400">เจ้าของ: ${item.ownerDept}</span></td>
                        <td class="p-4 text-slate-600">${item.borrowDate}</td>
                        <td class="p-4 text-slate-600">${item.dueDate}</td>
                        <td class="p-4">${statusBadge}</td>
                        <td class="p-4 text-center">
                            ${item.status !== 'returned' ? `
                                <button onclick="returnItem('${item.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition shadow-sm">
                                    คืนอุปกรณ์
                                </button>
                            ` : '-'}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.innerText = "กำลังบันทึก...";
            submitBtn.disabled = true;

            const newItem = {
                id: Date.now().toString(),
                borrower: document.getElementById('borrowerName').value,
                dept: document.getElementById('department').value,
                ownerDept: document.getElementById('ownerDept').value,
                device: document.getElementById('deviceName').value,
                borrowDate: new Date().toISOString().split('T')[0],
                dueDate: document.getElementById('dueDate').value,
                status: 'active'
            };

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(newItem)
                });
                closeModal();
                document.getElementById('borrowForm').reset();
                await fetchBorrows();
            } catch (error) {
                alert("เกิดข้อผิดพลาดในการบันทึก");
            } finally {
                submitBtn.innerText = "บันทึกการยืม";
                submitBtn.disabled = false;
            }
        }

        async function returnItem(id) {
            if (!confirm("ยืนยันการรับคืนอุปกรณ์ชิ้นนี้?")) return;
            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "updateStatus", id: id, status: "returned" })
                });
                await fetchBorrows();
            } catch (error) {
                alert("เกิดข้อผิดพลาดในการอัปเดตสถานะ");
            }
        }

        function openModal() {
            document.getElementById('borrowModal').classList.remove('hidden');
            document.getElementById('borrowModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('borrowModal').classList.add('hidden');
            document.getElementById('borrowModal').classList.remove('flex');
        }

        window.onload = fetchBorrows;
    </script>
</body>
</html>
